<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hello World</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: system-ui, -apple-system, sans-serif;
      }
      body {
        margin: 0;
        padding: 16px;
        display: flex;
        flex-direction: column;
        gap: 10px;
        align-items: stretch;
        justify-content: center;
        background: transparent;
        color: #f0f0f0;
      }
      button {
        font-size: 15px;
        font-weight: 600;
        padding: 10px 18px;
        border: none;
        border-radius: 8px;
        background: #6c63ff;
        color: white;
        cursor: pointer;
        transition: background 0.15s ease;
      }
      button:hover {
        background: #574fd6;
      }
      button:active {
        transform: translateY(1px);
      }
      button.secondary {
        background: #2c2c34;
      }
      button.secondary:hover {
        background: #3a3a44;
      }
    </style>
  </head>
  <body>
    <button id="say-hello">👋 Say Hello to the Room</button>
    <button id="draw-graffiti" class="secondary">🎨 Tag the Map</button>
    <script type="module" src="main.js"></script>
  </body>
</html>
